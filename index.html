<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriveHub — Portail de location de voitures</title>
    <meta name="description" content="Comparez et réservez parmi les flottes de toutes nos agences partenaires en un seul endroit." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Pose data-theme AVANT le premier octet de CSS pour éviter le flash de thème.
      Doit rester aligné avec src/context/ThemeContext.tsx (même clé, même défaut).
      Identite Avis : le CLAIR est le defaut du site public comme de l'admin.
    -->
    <script>
      (function () {
        try {
          var isAdmin = location.pathname.indexOf('/admin') === 0;
          var key = isAdmin ? 'drivehub-theme-admin' : 'drivehub-theme-site';
          var saved = localStorage.getItem(key);
          var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
